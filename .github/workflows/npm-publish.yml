name: Publish public packages to npm

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Check unified version
        run: |
          node <<'JS'
          const assert = require('node:assert/strict')
          const paths = [
            '.',
            'packages/editor-react',
            'packages/editor-plugin-docx',
            'packages/editor-plugin-spreadsheet',
            'packages/agent-core',
          ]
          const version = require('./package.json').version
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`)
          for (const path of paths) {
            const pkg = require(`./${path}/package.json`)
            assert.equal(pkg.version, version, pkg.name)
            assert.equal(pkg.publishConfig.access, 'public', pkg.name)
            if (pkg.peerDependencies?.['@langeditor/core']) {
              assert.equal(pkg.peerDependencies['@langeditor/core'], `^${version}`, pkg.name)
            }
          }
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build core entries
        run: pnpm check

      - name: Check public packages
        run: pnpm -r --filter '@langeditor/*' --if-present typecheck

      - name: Test agent core
        run: pnpm --filter @langeditor/agent-core test

      - name: Build public packages
        run: pnpm -r --filter '@langeditor/*' --if-present build

      - name: Check package export files
        run: pnpm release:check

      - name: Publish core if missing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@langeditor/core@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@langeditor/core@$VERSION is already published"
          else
            pnpm publish --provenance --access public --no-git-checks --registry=https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish remaining public packages
        run: pnpm -r --filter '@langeditor/*' publish --provenance --access public --no-git-checks --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
